<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E10"/>
      <stop offset="50%" stop-color="#16151D"/>
      <stop offset="100%" stop-color="#09090C"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="950" cy="180" r="450" fill="url(#og-glow)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Content -->
  <g transform="translate(100, 120)">
    <!-- Pill Badge -->
    <rect width="280" height="36" rx="18" fill="#201F25" stroke="#7C5CFF" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="4" fill="#4EDEA3"/>
    <text x="34" y="23" fill="#CABEFF" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AI TRAINER &amp; DATA LEAD • HELSINKI</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#E5E2E3" font-family="Space Grotesk, sans-serif" font-size="52" font-weight="700">Datshin Abinanth Raj</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#CABEFF" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="600">Precision Engineering Meets Frontier AI Evaluation.</text>

    <!-- Description -->
    <text x="0" y="240" fill="#938EA1" font-family="Inter, sans-serif" font-size="18">Bridging 10+ years of structural precision with LLM training,</text>
    <text x="0" y="270" fill="#938EA1" font-family="Inter, sans-serif" font-size="18">human feedback datasets, and quality-first AI data operations.</text>

    <!-- Footer Tags -->
    <g transform="translate(0, 340)">
      <rect width="180" height="38" rx="8" fill="#18181D" stroke="#353436"/>
      <text x="90" y="24" fill="#E5E2E3" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" text-anchor="middle">micro1 AI Trainer</text>

      <rect x="200" width="220" height="38" rx="8" fill="#18181D" stroke="#353436"/>
      <text x="310" y="24" fill="#E5E2E3" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" text-anchor="middle">HappyVerse Team Lead</text>

      <rect x="440" width="160" height="38" rx="8" fill="#18181D" stroke="#353436"/>
      <text x="520" y="24" fill="#4EDEA3" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Building 9UP.ai</text>
    </g>
  </g>
</svg>