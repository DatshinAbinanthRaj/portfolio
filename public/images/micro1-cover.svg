<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="m1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0E"/>
      <stop offset="100%" stop-color="#14131D"/>
    </linearGradient>
    <radialGradient id="m1-glow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#m1-bg)"/>
  <circle cx="350" cy="350" r="450" fill="url(#m1-glow)"/>

  <!-- Neural Network Vector Mesh -->
  <g stroke="#7C5CFF" stroke-opacity="0.2" stroke-width="1.2">
    <circle cx="300" cy="240" r="6" fill="#7C5CFF"/>
    <circle cx="450" cy="180" r="8" fill="#CABEFF"/>
    <circle cx="600" cy="250" r="6" fill="#7C5CFF"/>
    <circle cx="780" cy="190" r="9" fill="#4EDEA3"/>
    <circle cx="950" cy="270" r="6" fill="#7C5CFF"/>
    <line x1="300" y1="240" x2="450" y2="180"/>
    <line x1="450" y1="180" x2="600" y2="250"/>
    <line x1="600" y1="250" x2="780" y2="190"/>
    <line x1="780" y1="190" x2="950" y2="270"/>
  </g>

  <g transform="translate(180, 180)">
    <rect width="840" height="440" rx="16" fill="#16151B" stroke="#7C5CFF" stroke-opacity="0.3"/>
    <text x="50" y="60" fill="#CABEFF" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" letter-spacing="2">MICRO1 // FRONTIER MODEL RLHF &amp; EVALUATION PIPELINE</text>
    
    <rect x="50" y="90" width="740" height="90" rx="10" fill="#201F25"/>
    <text x="80" y="130" fill="#4EDEA3" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700">● ACTIVE QA EVALUATION WORKFLOW</text>
    <text x="80" y="155" fill="#938EA1" font-family="Inter, sans-serif" font-size="13">San Francisco Bay Area / Global Distributed Annotation Engine</text>

    <!-- Flow Steps -->
    <g transform="translate(50, 220)">
      <rect width="220" height="150" rx="10" fill="#1B1A22" stroke="#484555"/>
      <text x="25" y="45" fill="#7C5CFF" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">01</text>
      <text x="25" y="80" fill="#E5E2E3" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600">Prompt Structuring</text>
      <text x="25" y="110" fill="#938EA1" font-family="Inter, sans-serif" font-size="12">Multi-turn edge case design &amp; seed taxonomy</text>

      <rect x="260" width="220" height="150" rx="10" fill="#1B1A22" stroke="#484555"/>
      <text x="285" y="45" fill="#7C5CFF" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">02</text>
      <text x="285" y="80" fill="#E5E2E3" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600">Model Output Audit</text>
      <text x="285" y="110" fill="#938EA1" font-family="Inter, sans-serif" font-size="12">Hallucination detection, rubric grading &amp; scoring</text>

      <rect x="520" width="220" height="150" rx="10" fill="#1B1A22" stroke="#4EDEA3" stroke-opacity="0.5"/>
      <text x="545" y="45" fill="#4EDEA3" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">03</text>
      <text x="545" y="80" fill="#E5E2E3" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600">Golden Feedback</text>
      <text x="545" y="110" fill="#938EA1" font-family="Inter, sans-serif" font-size="12">Consensus-verified feedback for RLHF training</text>
    </g>
  </g>
</svg>